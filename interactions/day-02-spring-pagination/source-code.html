<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring Pagination</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    font-family: 'Space Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .nav-row { display: flex; align-items: center; justify-content: center; gap: 18px; }
  .chevron {
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; user-select: none; font-size: 17px; color: oklch(0.26 0.03 260);
    background: none; border: none; padding: 0; font-family: inherit;
    transition: color 180ms ease;
  }
  .chevron:hover { color: oklch(0.50 0.18 254); }

  .track { position: relative; }
  .dot {
    position: absolute; top: 0; border-radius: 999px; cursor: pointer;
    background: oklch(0.90 0.03 254);
    transition: background 200ms ease;
  }
  .dot:hover { background: oklch(0.84 0.06 254); }
  .pill {
    position: absolute; top: 0; border-radius: 999px;
    background: oklch(0.55 0.20 254);
    box-shadow: 0 4px 18px oklch(0.55 0.20 254 / 45%);
  }
  .label {
    position: absolute; display: flex; align-items: center; justify-content: center;
    font-size: 13px; cursor: pointer; color: oklch(0.55 0.02 260);
    opacity: .65;
    transition: color 240ms ease, opacity 240ms ease;
  }
  .label.active { color: oklch(0.50 0.18 254); font-weight: 600; opacity: 1; }
</style>
</head>
<body>

<div class="nav-row">
  <button class="chevron" id="prevBtn" aria-label="Previous page">‹</button>
  <div class="track" id="track"></div>
  <button class="chevron" id="nextBtn" aria-label="Next page">›</button>
</div>

<script>
/**
 * SpringPagination
 * Dot-based page navigation with an elastic "pill" that travels between
 * dots on click / prev / next.
 *
 * Mechanics:
 * - Travel duration scales with distance: `duration = baseMs + perStepMs * dist`.
 * - Built on the native Web Animations API (`element.animate()`) rather than
 *   a tweening library. Two channels drive the pill: its CENTRE travels with
 *   a spring (`cubic-bezier(0.34, 1 + overshoot, 0.64, 1)`, whose y > 1
 *   overshoots the target and eases back), while its WIDTH bulges out to
 *   span the gap and contracts again, peaking at the `stretch` fraction of
 *   the duration.
 * - Driving centre+width rather than left+width matters: it keeps the motion
 *   symmetric in both directions, and the width only ever bulges outward, so
 *   the pill can never squash into a sliver on a long jump.
 * - The curves are sampled into ~60 keyframes in JS and played back with
 *   linear interpolation, since a spring overshoot on one channel can't be
 *   expressed as per-segment CSS easings on the other.
 * - The destination is written to inline style before the animation starts:
 *   a WAAPI animation's fill does not persist after it finishes, so without
 *   that the pill would snap back to its previous inline position on end.
 * - Each move re-reads the pill's live on-screen geometry and cancels any
 *   in-flight animation, so rapid clicks continue from where the pill
 *   actually is instead of jumping.
 *
 * - The spring's overshoot is on the pill's CENTRE, but centre alone isn't
 *   what's on screen — centre + half the (still-bulging) width is. Without
 *   a cap, that combination pushes the pill's leading edge well past the
 *   destination dot before it settles back, which reads as sloppy rather
 *   than springy. Each frame is built from two edges instead of centre+width
 *   directly: the trailing edge is left exactly as the raw centre/width
 *   would put it (that side never leaked), while the leading edge is
 *   clamped to `destinationEdge + edgeBounce` — a couple of px of genuine
 *   bounce, not the multi-dot overshoot the raw spring produces. Centre and
 *   width for the frame are then rebuilt from those two edges, so this is a
 *   clamp on the rendered shape, not a different easing curve.
 *
 * Tunables (edit the `cfg` object below): baseMs, perStepMs, stretch (0-1),
 * overshoot (spring amount), edgeBounce (px past the destination dot the
 * leading edge is allowed to peek), size/gap (dot geometry), glow (pill
 * shadow), count (number of pages).
 */
const cfg = { baseMs: 420, perStepMs: 170, stretch: 0.42, overshoot: 0.56, edgeBounce: 4, size: 16, gap: 28, glow: true, count: 4 };
const accent = 'oklch(0.55 0.20 254)';

const state = { page: 0, dur: 0 };
const track = document.getElementById('track');
let pillEl = null;

function spacing() { return cfg.size + cfg.gap; }

function cancelAnims() {
  if (pillEl && pillEl.getAnimations) pillEl.getAnimations().forEach(a => a.cancel());
}

// Evaluates a CSS-style cubic-bezier(x1,y1,x2,y2) in JS, so the keyframes
// below can be sampled at arbitrary points. `y` is deliberately allowed to
// exceed 1 — that overshoot past the target is what reads as the spring.
function cubicBezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sampleX = (t) => ((ax * t + bx) * t + cx) * t;
  const sampleY = (t) => ((ay * t + by) * t + cy) * t;
  const slopeX = (t) => (3 * ax * t + 2 * bx) * t + cx;
  return (x) => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) {           // Newton-Raphson: invert x(t)…
      const dx = sampleX(t) - x;
      if (Math.abs(dx) < 1e-6) break;
      const d = slopeX(t);
      if (Math.abs(d) < 1e-6) break;
      t -= dx / d;
    }
    return sampleY(t);                       // …then read y at that t.
  };
}
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

const STEPS = 60;

// Where the pill actually is on screen right now, mid-animation or not.
function pillGeom() {
  const cs = getComputedStyle(pillEl);
  const w = parseFloat(cs.width) || cfg.size;
  const m = new DOMMatrixReadOnly(cs.transform === 'none' ? '' : cs.transform);
  return { x: m.m41, w };
}

function go(idx) {
  if (idx === state.page || idx < 0 || idx > cfg.count - 1) return;
  const from = state.page;
  const dist = Math.abs(idx - from);
  const sp = spacing(), sz = cfg.size;

  const total = cfg.baseMs + dist * cfg.perStepMs;
  const stretchMs = Math.max(80, Math.round(total * cfg.stretch));
  const settleMs = Math.max(80, total - stretchMs);
  const dur = stretchMs + settleMs;
  const s = stretchMs / dur;                 // when the stretch peaks, 0..1

  // Start from the pill's real on-screen geometry rather than `from`'s dot,
  // so interrupting a transition continues from where it is instead of
  // snapping back to the logical position first.
  const cur = pillGeom();
  const cFrom = cur.x + cur.w / 2;
  const cTo = idx * sp + sz / 2;
  const stretchW = sz + dist * sp;
  const dir = idx > from ? 1 : -1;
  // The dot-aligned boundary the leading edge should land on at rest.
  const destEdge = dir === 1 ? idx * sp + sz : idx * sp;

  cancelAnims();
  state.page = idx;
  state.dur = dur;
  updateActivePage();

  // Commit the destination to inline style BEFORE animating. A WAAPI
  // animation's fill doesn't persist once it finishes, so the element has to
  // already hold its final value — otherwise it snaps back to whatever the
  // inline style last said the moment the animation ends.
  pillEl.style.transform = `translateX(${cTo - sz / 2}px)`;
  pillEl.style.width = sz + 'px';

  if (!pillEl.animate) return;

  // Animate the pill's CENTER with the spring and its WIDTH as a bulge that
  // grows and contracts. Driving centre+width (rather than left+width) keeps
  // the motion identical in both directions — the earlier left-edge version
  // only ever sprang when moving forward — and the width never dips below a
  // dot, so the pill can't squash into a sliver on long jumps.
  const spring = cubicBezier(0.34, 1 + cfg.overshoot, 0.64, 1);
  const frames = [];
  for (let i = 0; i <= STEPS; i++) {
    const t = i / STEPS;
    const center = cFrom + (cTo - cFrom) * spring(t);
    const w = t <= s
      ? cur.w + (stretchW - cur.w) * easeOutCubic(s ? t / s : 1)
      : stretchW + (sz - stretchW) * easeInOutCubic((t - s) / (1 - s));

    // Split centre+width into the two edges, clamp only the leading one
    // (the trailing edge never left its bounds, so it's passed through raw),
    // then rebuild centre/width so the render stays on the same two channels.
    const rawLead = dir === 1 ? center + w / 2 : center - w / 2;
    const trail = dir === 1 ? center - w / 2 : center + w / 2;
    const lead = dir === 1
      ? Math.min(rawLead, destEdge + cfg.edgeBounce)
      : Math.max(rawLead, destEdge - cfg.edgeBounce);
    const cw = Math.abs(lead - trail);
    const cc = (lead + trail) / 2;

    frames.push({
      transform: `translateX(${(cc - cw / 2).toFixed(2)}px)`,
      width: cw.toFixed(2) + 'px',
      offset: t,
    });
  }
  // Easing is already baked into the samples, so step between them linearly.
  pillEl.animate(frames, { duration: dur, easing: 'linear' });
}
function step() { go(state.page === cfg.count - 1 ? 0 : state.page + 1); }
function prev() { go(state.page === 0 ? cfg.count - 1 : state.page - 1); }

function buildTrack() {
  const sp = spacing(), N = cfg.count, sz = cfg.size;
  const rowH = sz + 30, labelTop = sz + 12;
  track.style.height = rowH + 'px';
  track.style.width = ((N - 1) * sp + sz) + 'px';
  track.innerHTML = '';

  for (let i = 0; i < N; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.left = (i * sp) + 'px';
    dot.style.width = sz + 'px';
    dot.style.height = sz + 'px';
    dot.onclick = () => go(i);
    track.appendChild(dot);
  }

  pillEl = document.createElement('div');
  pillEl.className = 'pill';
  // Position comes from `transform` alone (left pinned at 0) — it's the
  // channel go() animates, and keeping it off `left` avoids a layout pass
  // on every frame.
  pillEl.style.left = '0px';
  pillEl.style.transform = `translateX(${state.page * sp}px)`;
  pillEl.style.width = sz + 'px';
  pillEl.style.height = sz + 'px';
  pillEl.style.boxShadow = cfg.glow ? `0 4px 18px ${accent.replace(')', ' / 45%)')}` : 'none';
  track.appendChild(pillEl);

  for (let i = 0; i < N; i++) {
    const label = document.createElement('div');
    label.className = 'label' + (i === state.page ? ' active' : '');
    label.style.top = labelTop + 'px';
    label.style.left = (i * sp) + 'px';
    label.style.width = sz + 'px';
    label.textContent = String(i + 1);
    label.onclick = () => go(i);
    track.appendChild(label);
  }
}

function updateActivePage() {
  Array.from(track.querySelectorAll('.label')).forEach((label, i) => {
    label.classList.toggle('active', i === state.page);
  });
}

document.getElementById('prevBtn').onclick = prev;
document.getElementById('nextBtn').onclick = step;

buildTrack();
</script>
</body>
</html>
