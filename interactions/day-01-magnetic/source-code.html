<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magnetic Button</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

<!-- GSAP via CDN — no build step -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #dcd5c4;
    font-family: 'Space Grotesk', system-ui, sans-serif;
  }

  /* The wrapper defines the interaction zone — its center is the anchor the
     button pulls toward/away from. */
  .magnetic-wrap {
    position: relative;
    width: 240px;
    height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Neumorphic: same tone as the surface, depth comes purely from a paired
     light/dark shadow — a shape pressed out of clay. Shadow direction tracks
     the cursor (the "light source"); spread/intensity grow with pull
     distance (see shadowAt() below). */
  .magnetic-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 16px 40px;
    border-radius: 999px;
    background: #dcd5c4;
    border: .5px solid rgba(0, 0, 0, .02);
    color: #3a3122;
    text-shadow: 0 1px 0 rgba(255, 255, 255, .6);
    font: 400 16px/1 'Space Grotesk', system-ui, sans-serif;
    letter-spacing: .01em;
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    transition: box-shadow .4s ease-out, background .25s ease-out, border-color .25s ease-out, color .25s ease-out;
    will-change: transform;
    /* `transform` is intentionally NOT set here or anywhere else in CSS/JS.
       GSAP owns it exclusively — any other write to transform on this
       element (a class toggle, a re-render, etc.) will snap the button
       back to (0,0) mid-pull. */
  }
  .magnetic-btn:hover {
    background: #ebe5d5;
    border-color: rgba(0, 0, 0, .05);
    color: #2a2318;
  }
  .magnetic-btn span { pointer-events: none; }
</style>
</head>
<body>

  <div class="magnetic-wrap" id="magneticWrap">
    <button type="button" class="magnetic-btn" id="magneticBtn">
      <span>Save</span>
    </button>
  </div>

<script>
/**
 * MagneticButton
 * Cursor-following "magnetic" hover effect with an elastic release.
 *
 * Usage:
 *   const magnet = new MagneticButton(wrapperEl, buttonEl, {
 *     R: 120,          // px — radius of the magnetic field around the wrapper's center
 *     MAX: 36,          // px — maximum displacement at the center of the field
 *     pullDur: 0.5,     // s  — tween duration while cursor is inside the field
 *     releaseDur: 0.9,  // s  — tween duration snapping back to rest
 *     releaseAmp: 0.35, // elastic.out amplitude on release
 *     lightDamp: 0.15,  // 0..1 — how quickly the light direction catches up to the cursor (lower = laggier)
 *     onShadow: (f, dirX, dirY) => {...}, // f = 0..1 pull-distance fraction, dirX/dirY = unit vector toward the cursor (the light source)
 *   });
 *   magnet.init();
 *   // magnet.destroy() to tear down listeners when removing the element.
 *
 * R, MAX, pullDur, releaseDur and releaseAmp are plain instance properties —
 * a live tweak panel (or any settings UI) can mutate them directly
 * (e.g. `magnet.R = 80`) and the next animation frame picks up the change.
 *
 * Mechanics:
 * - The wrapper's bounding-box center is the anchor. Distance `d` from the
 *   anchor to the pointer is compared against radius `R`.
 * - Inside the field, displacement follows an ease-out-quad taper: distance
 *   maps 0..R -> displacement 0..MAX, easing out so it's most sensitive near
 *   the anchor and flattens near the field's edge.
 *   taper(d) = MAX * (1 - (1 - clamp(d/R,0,1))^2)
 * - The button is pulled with GSAP power3.out; leaving the field triggers a
 *   spring-like elastic.out(1, releaseAmp) snap back to (0,0).
 * - Re-tweens are skipped unless the target moved > 0.5px, avoiding jitter
 *   from issuing a fresh tween every animation frame.
 * - The light source is treated as sitting at the cursor: `onShadow` fires
 *   every frame (not just while pulling) with a unit vector pointing from
 *   the button toward the cursor, damped by `lightDamp` so the shadow angle
 *   eases rather than snaps as the cursor moves. Consumers use this vector
 *   to offset a highlight toward the cursor and a shadow away from it.
 */
class MagneticButton {
  constructor(wrapEl, pillEl, options = {}) {
    this.wrapEl = wrapEl;
    this.pillEl = pillEl;
    this.R = options.R ?? 120;
    this.MAX = options.MAX ?? 36;
    this.pullDur = options.pullDur ?? 0.5;
    this.releaseDur = options.releaseDur ?? 0.9;
    this.releaseAmp = options.releaseAmp ?? 0.35;
    this.pressScale = options.pressScale ?? 0.94;
    this.pressDownDur = options.pressDownDur ?? 0.15;
    this.pressUpDur = options.pressUpDur ?? 0.4;
    this.lightDamp = options.lightDamp ?? 0.15;
    this.onShadow = options.onShadow || null;
    this.onModeChange = options.onModeChange || null;
    this.onPressChange = options.onPressChange || null;

    this.anchor = null;
    this.cursor = { x: -99999, y: -99999 };
    this.lastTarget = { x: 0, y: 0 };
    this.mode = 'idle'; // idle | pull | release
    this.pressed = false;
    // Unit vector from the button toward the cursor — the light direction.
    // Starts pointing up-left, the conventional resting light source; the
    // very first real cursor position (tracked from off-screen at
    // construction) naturally eases it from there.
    this.lightDir = { x: -0.7071, y: -0.7071 };
    this.raf = 0;

    this._onMove = this._onMove.bind(this);
    this._onResize = this._onResize.bind(this);
    this._onWrapLeave = this._onWrapLeave.bind(this);
    this._onPressStart = this._onPressStart.bind(this);
    this._onPressEnd = this._onPressEnd.bind(this);
    this._tick = this._tick.bind(this);
  }

  init() {
    this.captureAnchor();
    gsap.set(this.pillEl, { x: 0, y: 0 });
    this._setShadow(0);

    window.addEventListener('pointermove', this._onMove, { passive: true });
    window.addEventListener('resize', this._onResize);
    window.addEventListener('scroll', this._onResize, { passive: true });
    window.addEventListener('pointerup', this._onPressEnd);
    window.addEventListener('pointercancel', this._onPressEnd);
    this.wrapEl.addEventListener('pointerleave', this._onWrapLeave);
    this.pillEl.addEventListener('pointerdown', this._onPressStart);
    this.pillEl.addEventListener('pointerleave', this._onPressEnd);

    this.raf = requestAnimationFrame(this._tick);
    return this;
  }

  destroy() {
    window.removeEventListener('pointermove', this._onMove);
    window.removeEventListener('resize', this._onResize);
    window.removeEventListener('scroll', this._onResize);
    window.removeEventListener('pointerup', this._onPressEnd);
    window.removeEventListener('pointercancel', this._onPressEnd);
    this.wrapEl.removeEventListener('pointerleave', this._onWrapLeave);
    this.pillEl.removeEventListener('pointerdown', this._onPressStart);
    this.pillEl.removeEventListener('pointerleave', this._onPressEnd);
    cancelAnimationFrame(this.raf);
  }

  captureAnchor() {
    const r = this.wrapEl.getBoundingClientRect();
    this.anchor = { cx: r.left + r.width / 2, cy: r.top + r.height / 2 };
  }

  _onMove(e) {
    this.cursor.x = e.clientX;
    this.cursor.y = e.clientY;
  }

  _onResize() {
    this.captureAnchor();
  }

  _taper(d) {
    const nd = Math.min(1, Math.max(0, d / this.R));
    return this.MAX * (1 - (1 - nd) * (1 - nd)); // ease-out-quad
  }

  _setShadow(f) {
    if (this.onShadow) this.onShadow(Math.max(0, Math.min(1, f)), this.lightDir.x, this.lightDir.y);
  }

  _setMode(m) {
    if (this.mode === m) return;
    this.mode = m;
    if (this.onModeChange) this.onModeChange(m);
  }

  _release() {
    this._setMode('release');
    this.lastTarget.x = 0;
    this.lastTarget.y = 0;
    gsap.to(this.pillEl, {
      x: 0, y: 0,
      duration: this.releaseDur,
      ease: `elastic.out(1, ${this.releaseAmp})`,
      overwrite: 'auto',
      onComplete: () => { this._setMode('idle'); },
    });
  }

  _onWrapLeave() {
    // Safety net for fast pointer exits the per-frame field check might miss
    // between animation frames.
    if (this.mode === 'pull') this._release();
  }

  // Press feedback is a separate transform channel (scale) from the magnetic
  // pull (x/y), so it tweens independently without disturbing an in-flight
  // pull/release tween — GSAP composites both into one matrix on render.
  _onPressStart(e) {
    if (this.pressed) return;
    if (e && e.button !== undefined && e.button !== 0) return; // left click / primary touch only
    this.pressed = true;
    gsap.to(this.pillEl, {
      scale: this.pressScale,
      duration: this.pressDownDur,
      ease: 'power2.out',
      overwrite: 'auto',
    });
    if (this.onPressChange) this.onPressChange(true);
  }

  _onPressEnd() {
    if (!this.pressed) return;
    this.pressed = false;
    gsap.to(this.pillEl, {
      scale: 1,
      duration: this.pressUpDur,
      ease: 'back.out(2.2)',
      overwrite: 'auto',
    });
    if (this.onPressChange) this.onPressChange(false);
  }

  _tick() {
    if (this.anchor) {
      const { cx, cy } = this.anchor;
      const dx = this.cursor.x - cx;
      const dy = this.cursor.y - cy;
      const d = Math.hypot(dx, dy);
      const insideField = d < this.R;

      // Light direction eases toward the cursor every frame, independent of
      // whether the cursor is inside the magnetic field — the lighting
      // reacts to the cursor across the whole viewport, the pull only near
      // the button. Damped in angle space (not by lerping x/y then
      // renormalizing) because a straight vector lerp degenerates when the
      // target is ~180° from the current direction: interpolating two
      // near-antipodal vectors stays collinear with the start, so
      // renormalizing snaps it right back — a stable fixed point that never
      // rotates. Angle-space lerp always takes the shortest rotational path.
      if (d > 0.0001) {
        const targetAngle = Math.atan2(dy, dx);
        const curAngle = Math.atan2(this.lightDir.y, this.lightDir.x);
        let diff = targetAngle - curAngle;
        diff = ((diff + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
        const newAngle = curAngle + diff * this.lightDamp;
        this.lightDir.x = Math.cos(newAngle);
        this.lightDir.y = Math.sin(newAngle);
      }

      let f = 0;
      if (insideField) {
        const mag = this._taper(d);
        const inv = d > 0.0001 ? mag / d : 0;
        const tx = dx * inv;
        const ty = dy * inv;
        this._setMode('pull');

        const moved = Math.hypot(tx - this.lastTarget.x, ty - this.lastTarget.y) > 0.5;
        if (moved) {
          this.lastTarget.x = tx;
          this.lastTarget.y = ty;
          gsap.to(this.pillEl, {
            x: tx, y: ty,
            duration: this.pullDur,
            ease: 'power3.out',
            overwrite: 'auto',
          });
        }
        f = mag / this.MAX;
      } else if (this.mode === 'pull') {
        this._release();
      }
      this._setShadow(f);
    }
    this.raf = requestAnimationFrame(this._tick);
  }
}

// ---------------------------------------------------------------------
// Usage
// ---------------------------------------------------------------------
const wrapEl = document.getElementById('magneticWrap');
const pillEl = document.getElementById('magneticBtn');

// Light source = the cursor. `dirX, dirY` is the unit vector from the button
// toward it: the light-colored shadow is offset toward that vector (the face
// catching the light), the dark one offset away from it (the face in shadow).
function neuOffsets(off, dirX, dirY) {
  return {
    darkX: (-dirX * off).toFixed(1), darkY: (-dirY * off).toFixed(1),
    lightX: (dirX * off).toFixed(1), lightY: (dirY * off).toFixed(1),
  };
}

// Neumorphic depth shadow: paired dark/light shadow, both growing with pull
// distance fraction `f` (0 at rest, 1 at MAX displacement).
function shadowAt(f, dirX, dirY) {
  const off = 6 + 12 * f, blur = 12 + 24 * f;
  const dark = 0.35 + 0.15 * f, light = 0.75;
  const o = neuOffsets(off, dirX, dirY);
  return `${o.darkX}px ${o.darkY}px ${blur.toFixed(1)}px rgba(120,105,75,${dark.toFixed(3)}), ${o.lightX}px ${o.lightY}px ${blur.toFixed(1)}px rgba(255,255,255,${light})`;
}

// Pressed state inverts the shadow to read as carved INTO the surface
// (inset on both sides) — the neumorphic "pushed" read.
function pressedShadowStyle(dirX, dirY) {
  const o = neuOffsets(4, dirX, dirY);
  return `inset ${o.darkX}px ${o.darkY}px 9px rgba(120,105,75,.45), inset ${o.lightX}px ${o.lightY}px 9px rgba(255,255,255,.6)`;
}

let isPressed = false;

const magnet = new MagneticButton(wrapEl, pillEl, {
  onShadow: (f, dirX, dirY) => {
    pillEl.style.boxShadow = isPressed
      ? pressedShadowStyle(dirX, dirY)
      : shadowAt(f, dirX, dirY);
  },
  onPressChange: (pressed) => { isPressed = pressed; },
});

requestAnimationFrame(() => magnet.init());
</script>
</body>
</html>
