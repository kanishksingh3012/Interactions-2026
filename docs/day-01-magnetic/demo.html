<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magnetic Button — Day 01 · Interaction Challenge</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- GSAP via CDN — no build step -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
  :root {
    color-scheme: light;
    --stage-bg: #dcd5c4;
    --ring-color: rgba(122, 109, 84, .4);
    --btn-color: #3a3122;
    --btn-border: rgba(0, 0, 0, .02);
    --btn-text-shadow: 0 1px 0 rgba(255, 255, 255, .6);
    --btn-hover-bg: #ebe5d5;
    --btn-hover-color: #2a2318;
    --btn-hover-border: rgba(0, 0, 0, .05);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --stage-bg: #221f19;
    --ring-color: rgba(233, 226, 208, .3);
    --btn-color: #ece4d2;
    --btn-border: rgba(255, 255, 255, .05);
    --btn-text-shadow: 0 1px 0 rgba(0, 0, 0, .5);
    --btn-hover-bg: #2b271f;
    --btn-hover-color: #f8f1dd;
    --btn-hover-border: rgba(255, 255, 255, .09);
  }
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    background: var(--stage-bg);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    transition: background .35s ease;
  }

  /* ---- Magnetic field wrapper ----
     The wrapper defines the interaction zone. Its center is the anchor the
     button pulls toward/away from. --mb-r is kept in sync with R by the
     tweak panel's slider handler. */
  .magnetic-wrap {
    position: relative;
    width: 240px;
    height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
    --mb-r: 120px;
  }

  .magnetic-field-ring {
    position: absolute;
    top: 50%; left: 50%;
    width: calc(var(--mb-r) * 2);
    height: calc(var(--mb-r) * 2);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 1px dashed transparent;
    pointer-events: none;
    transition: border-color .3s ease;
  }
  .magnetic-field-ring.is-visible {
    border-color: var(--ring-color);
  }

  /* ---- The button itself ----
     Neumorphic theme: same tone as the surface, depth comes purely from a
     paired light/dark shadow pair — a shape pressed out of clay. Shadow
     spread and intensity grow with pull distance (see shadowAt()). */
  .magnetic-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 16px 40px;
    border-radius: 999px;
    background: var(--stage-bg);
    border: .5px solid var(--btn-border);
    color: var(--btn-color);
    text-shadow: var(--btn-text-shadow);
    font: 400 16px/1 'Space Grotesk', system-ui, sans-serif;
    letter-spacing: .01em;
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    transition: box-shadow .4s ease-out, background .3s ease-out, border-color .3s ease-out, color .3s ease-out;
    will-change: transform;
    /* `transform` is intentionally NOT set here or anywhere else in CSS/JS.
       GSAP owns it exclusively — any other write to transform on this
       element (a class toggle, a re-render, etc.) will snap the button
       back to (0,0) mid-pull. */
  }
  .magnetic-btn:hover {
    background: var(--btn-hover-bg);
    border-color: var(--btn-hover-border);
    color: var(--btn-hover-color);
  }
  .magnetic-btn span { pointer-events: none; }

  .view-source {
    position: fixed;
    bottom: 24px;
    left: 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--btn-color);
    opacity: .45;
    text-decoration: none;
    transition: opacity .2s ease, color .3s ease;
  }
  .view-source:hover { opacity: .85; }

  /* ---------------------------------------------------------------------
     Tweaks panel — floating, always dark so it reads against any surface
     the button theme puts behind it.
  --------------------------------------------------------------------- */
  .tweaks {
    position: fixed;
    top: 24px;
    right: 24px;
    width: 288px;
    padding: 14px 16px 15px;
    background: rgba(16, 14, 10, .88);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 14px;
    font-family: 'JetBrains Mono', monospace;
    color: #e9e2d0;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
    z-index: 100;
  }
  .tweaks-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .tweaks-title {
    font-size: 10px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: #8a7d5f;
  }
  .tweaks-mode {
    font-size: 10px;
    color: #d9a441;
    text-transform: uppercase;
    letter-spacing: .1em;
  }
  .tweaks-head-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .collapse-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    padding: 0;
    background: transparent;
    border: none;
    color: #8a7d5f;
    cursor: pointer;
  }
  .collapse-btn:hover { color: #c7bda2; }
  .collapse-btn svg {
    width: 10px;
    height: 10px;
    transition: transform .3s cubic-bezier(.65, 0, .35, 1);
  }
  .tweaks.is-collapsed .collapse-btn svg { transform: rotate(-90deg); }

  /* Grid-rows collapse: 1fr -> 0fr animates height without measuring pixels.
     `.tweaks-body-inner` needs `overflow:hidden` + `min-height:0` so the grid
     item can actually shrink past its content's intrinsic size. */
  .tweaks-body {
    display: grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows .3s cubic-bezier(.65, 0, .35, 1), opacity .2s ease;
    opacity: 1;
  }
  .tweaks-body-inner {
    overflow: hidden;
    min-height: 0;
  }
  .tweaks.is-collapsed .tweaks-body {
    grid-template-rows: 0fr;
    opacity: 0;
  }

  .theme-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(255, 255, 255, .08);
  }
  .theme-row-label {
    font-size: 10px;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: #c7bda2;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 38px;
    height: 20px;
    cursor: pointer;
  }
  .switch input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }
  .switch-track {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: rgba(255, 255, 255, .14);
    transition: background .25s ease;
  }
  .switch-thumb {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #e9e2d0;
    transition: transform .3s cubic-bezier(.34, 1.56, .64, 1), background .25s ease;
  }
  .switch input:checked + .switch-track { background: #d9a441; }
  .switch input:checked + .switch-track .switch-thumb { transform: translateX(18px); background: #1a1712; }

  .tweak-row { margin-bottom: 9px; }
  .tweak-row:last-of-type { margin-bottom: 0; }
  .tweak-row-head {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: #c7bda2;
    margin-bottom: 3px;
    letter-spacing: .05em;
  }
  .tweak-row-head span:last-child {
    color: #d9a441;
    font-variant-numeric: tabular-nums;
  }

  input[type=range].tweak {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; background: rgba(255, 255, 255, .14);
    border-radius: 999px; outline: none; margin: 0;
  }
  input[type=range].tweak::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: #d9a441; cursor: pointer; border: 2px solid #1a1712;
  }
  input[type=range].tweak::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: #d9a441; cursor: pointer; border: 2px solid #1a1712;
  }

  .field-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    color: #c7bda2;
    letter-spacing: .05em;
    cursor: pointer;
    user-select: none;
    margin: 10px 0 0;
  }
  .field-toggle input {
    accent-color: #d9a441;
    width: 14px; height: 14px; margin: 0;
    cursor: pointer;
  }

  .reset-btn {
    margin-top: 10px;
    width: 100%;
    padding: 7px 10px;
    background: transparent;
    color: #8a7d5f;
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 8px;
    font: 500 10px/1 'JetBrains Mono', monospace;
    letter-spacing: .14em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .reset-btn:hover { color: #c7bda2; border-color: rgba(255, 255, 255, .16); }
</style>

  <div class="magnetic-wrap" id="magneticWrap">
    <div class="magnetic-field-ring" id="fieldRing" aria-hidden="true"></div>
    <button type="button" class="magnetic-btn" id="magneticBtn">
      <span>Save</span>
    </button>
  </div>

  <!-- ---------------------------------------------------------------------
       Tweaks panel
  --------------------------------------------------------------------- -->
  <aside class="tweaks" id="tweaksPanel">
    <div class="tweaks-head">
      <div class="tweaks-title">Tweaks</div>
      <div class="tweaks-head-right">
        <div class="tweaks-mode" id="modeLabel">idle</div>
        <button type="button" class="collapse-btn" id="collapseBtn" aria-expanded="true" aria-controls="tweaksBody" aria-label="Collapse panel">
          <svg viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <div class="tweaks-body" id="tweaksBody"><div class="tweaks-body-inner">

    <div class="theme-row">
      <span class="theme-row-label">Dark mode</span>
      <label class="switch">
        <input type="checkbox" id="themeToggle" />
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </label>
    </div>

    <div class="tweak-row">
      <div class="tweak-row-head"><span>Field radius R</span><span id="val-R">120px</span></div>
      <input type="range" class="tweak" id="in-R" min="60" max="220" step="1" value="120" />
    </div>
    <div class="tweak-row">
      <div class="tweak-row-head"><span>Max displacement</span><span id="val-MAX">36px</span></div>
      <input type="range" class="tweak" id="in-MAX" min="8" max="90" step="1" value="36" />
    </div>
    <div class="tweak-row">
      <div class="tweak-row-head"><span>Pull duration</span><span id="val-pullDur">0.50s</span></div>
      <input type="range" class="tweak" id="in-pullDur" min="0.15" max="1.2" step="0.05" value="0.5" />
    </div>
    <div class="tweak-row">
      <div class="tweak-row-head"><span>Release duration</span><span id="val-releaseDur">0.90s</span></div>
      <input type="range" class="tweak" id="in-releaseDur" min="0.3" max="1.8" step="0.05" value="0.9" />
    </div>
    <div class="tweak-row">
      <div class="tweak-row-head"><span>Release elastic amp</span><span id="val-releaseAmp">0.35</span></div>
      <input type="range" class="tweak" id="in-releaseAmp" min="0.15" max="0.7" step="0.01" value="0.35" />
    </div>
    <div class="tweak-row">
      <div class="tweak-row-head"><span>Label font size</span><span id="val-fontSize">16px</span></div>
      <input type="range" class="tweak" id="in-fontSize" min="12" max="28" step="1" value="16" />
    </div>
    <div class="tweak-row">
      <div class="tweak-row-head"><span>Press scale</span><span id="val-pressScale">0.94</span></div>
      <input type="range" class="tweak" id="in-pressScale" min="0.85" max="0.99" step="0.01" value="0.94" />
    </div>

    <label class="field-toggle">
      <input type="checkbox" id="fieldToggle" />
      Show field ring
    </label>

    <button type="button" class="reset-btn" id="resetBtn">Reset defaults</button>

    </div></div>
  </aside>

<script>
/**
 * MagneticButton
 * Cursor-following "magnetic" hover effect with an elastic release.
 * See /interactions/day-01-magnetic/source-code.html for the clean,
 * panel-free version of this component and its full usage docs.
 */
class MagneticButton {
  constructor(wrapEl, pillEl, options = {}) {
    this.wrapEl = wrapEl;
    this.pillEl = pillEl;
    this.R = options.R ?? 120;
    this.MAX = options.MAX ?? 36;
    this.pullDur = options.pullDur ?? 0.5;
    this.releaseDur = options.releaseDur ?? 0.9;
    this.releaseAmp = options.releaseAmp ?? 0.35;
    this.pressScale = options.pressScale ?? 0.94;
    this.pressDownDur = options.pressDownDur ?? 0.15;
    this.pressUpDur = options.pressUpDur ?? 0.4;
    this.lightDamp = options.lightDamp ?? 0.15;
    this.onShadow = options.onShadow || null;
    this.onModeChange = options.onModeChange || null;
    this.onPressChange = options.onPressChange || null;

    this.anchor = null;
    this.cursor = { x: -99999, y: -99999 };
    this.lastTarget = { x: 0, y: 0 };
    this.mode = 'idle'; // idle | pull | release
    this.pressed = false;
    this.lightDir = { x: -0.7071, y: -0.7071 };
    this.raf = 0;

    this._onMove = this._onMove.bind(this);
    this._onResize = this._onResize.bind(this);
    this._onWrapLeave = this._onWrapLeave.bind(this);
    this._onPressStart = this._onPressStart.bind(this);
    this._onPressEnd = this._onPressEnd.bind(this);
    this._tick = this._tick.bind(this);
  }

  init() {
    this.captureAnchor();
    gsap.set(this.pillEl, { x: 0, y: 0 });
    this._setShadow(0);

    window.addEventListener('pointermove', this._onMove, { passive: true });
    window.addEventListener('resize', this._onResize);
    window.addEventListener('scroll', this._onResize, { passive: true });
    window.addEventListener('pointerup', this._onPressEnd);
    window.addEventListener('pointercancel', this._onPressEnd);
    this.wrapEl.addEventListener('pointerleave', this._onWrapLeave);
    this.pillEl.addEventListener('pointerdown', this._onPressStart);
    this.pillEl.addEventListener('pointerleave', this._onPressEnd);

    this.raf = requestAnimationFrame(this._tick);
    return this;
  }

  destroy() {
    window.removeEventListener('pointermove', this._onMove);
    window.removeEventListener('resize', this._onResize);
    window.removeEventListener('scroll', this._onResize);
    window.removeEventListener('pointerup', this._onPressEnd);
    window.removeEventListener('pointercancel', this._onPressEnd);
    this.wrapEl.removeEventListener('pointerleave', this._onWrapLeave);
    this.pillEl.removeEventListener('pointerdown', this._onPressStart);
    this.pillEl.removeEventListener('pointerleave', this._onPressEnd);
    cancelAnimationFrame(this.raf);
  }

  captureAnchor() {
    const r = this.wrapEl.getBoundingClientRect();
    this.anchor = { cx: r.left + r.width / 2, cy: r.top + r.height / 2 };
  }

  _onMove(e) {
    this.cursor.x = e.clientX;
    this.cursor.y = e.clientY;
  }

  _onResize() {
    this.captureAnchor();
  }

  _taper(d) {
    const nd = Math.min(1, Math.max(0, d / this.R));
    return this.MAX * (1 - (1 - nd) * (1 - nd)); // ease-out-quad
  }

  _setShadow(f) {
    if (this.onShadow) this.onShadow(Math.max(0, Math.min(1, f)), this.lightDir.x, this.lightDir.y);
  }

  _setMode(m) {
    if (this.mode === m) return;
    this.mode = m;
    if (this.onModeChange) this.onModeChange(m);
  }

  _release() {
    this._setMode('release');
    this.lastTarget.x = 0;
    this.lastTarget.y = 0;
    gsap.to(this.pillEl, {
      x: 0, y: 0,
      duration: this.releaseDur,
      ease: `elastic.out(1, ${this.releaseAmp})`,
      overwrite: 'auto',
      onComplete: () => { this._setMode('idle'); },
    });
  }

  _onWrapLeave() {
    if (this.mode === 'pull') this._release();
  }

  _onPressStart(e) {
    if (this.pressed) return;
    if (e && e.button !== undefined && e.button !== 0) return;
    this.pressed = true;
    gsap.to(this.pillEl, {
      scale: this.pressScale,
      duration: this.pressDownDur,
      ease: 'power2.out',
      overwrite: 'auto',
    });
    if (this.onPressChange) this.onPressChange(true);
  }

  _onPressEnd() {
    if (!this.pressed) return;
    this.pressed = false;
    gsap.to(this.pillEl, {
      scale: 1,
      duration: this.pressUpDur,
      ease: 'back.out(2.2)',
      overwrite: 'auto',
    });
    if (this.onPressChange) this.onPressChange(false);
  }

  _tick() {
    if (this.anchor) {
      const { cx, cy } = this.anchor;
      const dx = this.cursor.x - cx;
      const dy = this.cursor.y - cy;
      const d = Math.hypot(dx, dy);
      const insideField = d < this.R;

      if (d > 0.0001) {
        const targetAngle = Math.atan2(dy, dx);
        const curAngle = Math.atan2(this.lightDir.y, this.lightDir.x);
        let diff = targetAngle - curAngle;
        diff = ((diff + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
        const newAngle = curAngle + diff * this.lightDamp;
        this.lightDir.x = Math.cos(newAngle);
        this.lightDir.y = Math.sin(newAngle);
      }

      let f = 0;
      if (insideField) {
        const mag = this._taper(d);
        const inv = d > 0.0001 ? mag / d : 0;
        const tx = dx * inv;
        const ty = dy * inv;
        this._setMode('pull');

        const moved = Math.hypot(tx - this.lastTarget.x, ty - this.lastTarget.y) > 0.5;
        if (moved) {
          this.lastTarget.x = tx;
          this.lastTarget.y = ty;
          gsap.to(this.pillEl, {
            x: tx, y: ty,
            duration: this.pullDur,
            ease: 'power3.out',
            overwrite: 'auto',
          });
        }
        f = mag / this.MAX;
      } else if (this.mode === 'pull') {
        this._release();
      }
      this._setShadow(f);
    }
    this.raf = requestAnimationFrame(this._tick);
  }
}

// ---------------------------------------------------------------------
// Demo wiring
// ---------------------------------------------------------------------
const wrapEl = document.getElementById('magneticWrap');
const pillEl = document.getElementById('magneticBtn');
const fieldRing = document.getElementById('fieldRing');
const fieldToggle = document.getElementById('fieldToggle');
const modeLabel = document.getElementById('modeLabel');

const DEFAULTS = { R: 120, MAX: 36, pullDur: 0.5, releaseDur: 0.9, releaseAmp: 0.35, fontSize: 16, pressScale: 0.94, showField: false };

function neuOffsets(off, dirX, dirY) {
  return {
    darkX: (-dirX * off).toFixed(1), darkY: (-dirY * off).toFixed(1),
    lightX: (dirX * off).toFixed(1), lightY: (dirY * off).toFixed(1),
  };
}

const SHADOW_THEMES = {
  light: { darkRGB: '120,105,75', lightRGB: '255,255,255', darkAlpha: f => 0.35 + 0.15 * f, lightAlpha: 0.75, pressDarkAlpha: 0.45, pressLightAlpha: 0.6 },
  dark:  { darkRGB: '0,0,0',      lightRGB: '255,255,255', darkAlpha: f => 0.55 + 0.2 * f,  lightAlpha: 0.07, pressDarkAlpha: 0.65, pressLightAlpha: 0.08 },
};
let theme = 'light';

function shadowAt(f, dirX, dirY) {
  const t = SHADOW_THEMES[theme];
  const off = 6 + 12 * f, blur = 12 + 24 * f;
  const o = neuOffsets(off, dirX, dirY);
  return `${o.darkX}px ${o.darkY}px ${blur.toFixed(1)}px rgba(${t.darkRGB},${t.darkAlpha(f).toFixed(3)}), ${o.lightX}px ${o.lightY}px ${blur.toFixed(1)}px rgba(${t.lightRGB},${t.lightAlpha})`;
}

function pressedShadowStyle(dirX, dirY) {
  const t = SHADOW_THEMES[theme];
  const o = neuOffsets(4, dirX, dirY);
  return `inset ${o.darkX}px ${o.darkY}px 9px rgba(${t.darkRGB},${t.pressDarkAlpha}), inset ${o.lightX}px ${o.lightY}px 9px rgba(${t.lightRGB},${t.pressLightAlpha})`;
}

let isPressed = false;

const magnet = new MagneticButton(wrapEl, pillEl, {
  R: DEFAULTS.R,
  MAX: DEFAULTS.MAX,
  pullDur: DEFAULTS.pullDur,
  releaseDur: DEFAULTS.releaseDur,
  releaseAmp: DEFAULTS.releaseAmp,
  pressScale: DEFAULTS.pressScale,
  onShadow: (f, dirX, dirY) => {
    pillEl.style.boxShadow = isPressed
      ? pressedShadowStyle(dirX, dirY)
      : shadowAt(f, dirX, dirY);
  },
  onModeChange: (m) => { modeLabel.textContent = m; },
  onPressChange: (pressed) => { isPressed = pressed; },
});

requestAnimationFrame(() => magnet.init());

fieldToggle.addEventListener('change', (e) => {
  fieldRing.classList.toggle('is-visible', e.target.checked);
});

const themeToggle = document.getElementById('themeToggle');
themeToggle.addEventListener('change', (e) => {
  theme = e.target.checked ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
});

const tweaksPanel = document.getElementById('tweaksPanel');
const collapseBtn = document.getElementById('collapseBtn');
collapseBtn.addEventListener('click', () => {
  const collapsed = tweaksPanel.classList.toggle('is-collapsed');
  collapseBtn.setAttribute('aria-expanded', String(!collapsed));
  collapseBtn.setAttribute('aria-label', collapsed ? 'Expand panel' : 'Collapse panel');
});

// ---- Tweak panel bindings ----
const controls = {
  R:          { el: document.getElementById('in-R'),          val: document.getElementById('val-R'),          fmt: v => `${v}px` },
  MAX:        { el: document.getElementById('in-MAX'),        val: document.getElementById('val-MAX'),        fmt: v => `${v}px` },
  pullDur:    { el: document.getElementById('in-pullDur'),    val: document.getElementById('val-pullDur'),    fmt: v => `${v.toFixed(2)}s` },
  releaseDur: { el: document.getElementById('in-releaseDur'), val: document.getElementById('val-releaseDur'), fmt: v => `${v.toFixed(2)}s` },
  releaseAmp: { el: document.getElementById('in-releaseAmp'), val: document.getElementById('val-releaseAmp'), fmt: v => v.toFixed(2) },
  fontSize:   { el: document.getElementById('in-fontSize'),   val: document.getElementById('val-fontSize'),   fmt: v => `${v}px` },
  pressScale: { el: document.getElementById('in-pressScale'), val: document.getElementById('val-pressScale'), fmt: v => v.toFixed(2) },
};

function applyControl(key, value) {
  controls[key].val.textContent = controls[key].fmt(value);
  if (key === 'R') {
    magnet.R = value;
    wrapEl.style.setProperty('--mb-r', `${value}px`);
  } else if (key === 'fontSize') {
    pillEl.style.fontSize = `${value}px`;
  } else {
    magnet[key] = value;
  }
}

Object.entries(controls).forEach(([key, { el }]) => {
  el.addEventListener('input', (e) => applyControl(key, parseFloat(e.target.value)));
});

function resetDefaults() {
  Object.entries(DEFAULTS).forEach(([key, value]) => {
    if (key === 'showField') return;
    controls[key].el.value = value;
    applyControl(key, value);
  });
  fieldToggle.checked = DEFAULTS.showField;
  fieldRing.classList.toggle('is-visible', DEFAULTS.showField);
}
document.getElementById('resetBtn').addEventListener('click', resetDefaults);
</script>
</body>
</html>
